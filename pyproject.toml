[project]
name = "ComfyUI-AssetsPlus"
description = "Adds 'Assets+' tool to ComfyUI sidebar, which builds upon 'Media Assets' idea albeit expands it to bring Gallery-like experience to Windows machines"
version = "1.0.2"
license = {file = "LICENSE"} 
requires-python = ">=3.9"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[project.urls]
Repository = "https://github.com/DIGIDWARF-CC/ComfyUI-AssetsPlus"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/DIGIDWARF-CC/ComfyUI-AssetsPlus/wiki"
"Bug Tracker" = "https://github.com/DIGIDWARF-CC/ComfyUI-AssetsPlus/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "Pillow"]

[tool.comfy]
PublisherId = "digidwarf"
DisplayName = "ComfyUI-AssetsPlus"
Icon = "https://raw.githubusercontent.com/DIGIDWARF-CC/ComfyUI-AssetsPlus/refs/heads/main/meta/img/logo_1024x700.png"
includes = [] 
